<style>
        body {

            font-family: 'Inter', sans-serif;

<body class="flex flex-col min-h-screen max-w-md mx-auto relative overflow-hidden">
<!-- Top Navigation Bar -->
<header class="flex justify-between items-center w-full px-margin-mobile h-14 z-50">
<div class="flex items-center gap-4">
<button class="w-10 h-10 flex items-center justify-center rounded-full bg-surface-container-low hover:opacity-80 active:scale-95 transition-all">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</button>
<button class="w-10 h-10 flex items-center justify-center rounded-full bg-surface-container-low hover:opacity-80 active:scale-95 transition-all">
<span class="material-symbols-outlined text-primary">more_horiz</span>
</button>
</div>
<div class="flex items-center gap-1">
<span class="text-primary font-headline-md text-headline-md">2</span>
<span class="text-outline font-headline-md text-headline-md">/ 18</span>
</div>
<button class="px-6 py-2 rounded-full bg-surface-container-highest text-primary font-body-md text-body-md hover:opacity-80 active:scale-95 transition-all">
            Finish
        </button>
</header>
<!-- Main Timer Content -->
<main class="flex-1 flex flex-col items-center justify-center pt-8 pb-12">
<div class="timer-container text-center">
<h1 class="text-stat-lg font-stat-lg timer-glow mb-2">01:33</h1>
<p class="text-outline font-body-md text-body-md tracking-widest opacity-60">01:25</p>
</div>
<div class="flex items-center justify-center gap-12 mt-16 w-full px-12">
<button class="flex flex-col items-center gap-2 group">
<div class="w-12 h-12 rounded-full flex items-center justify-center bg-transparent group-active:scale-90 transition-transform">
<span class="material-symbols-outlined text-primary text-3xl">replay_10</span>
</div>
</button>
<button class="text-primary font-headline-md text-headline-md uppercase tracking-widest active:scale-95 transition-transform">
                Skip
            </button>
<button class="flex flex-col items-center gap-2 group">
<div class="w-12 h-12 rounded-full flex items-center justify-center bg-transparent group-active:scale-90 transition-transform">
<span class="material-symbols-outlined text-primary text-3xl">forward_10</span>
</div>
</button>
</div>
<!-- Pagination Indicator -->
<div class="flex gap-2 mt-12">
<div class="w-2 h-2 rounded-full bg-primary"></div>
<div class="w-2 h-2 rounded-full bg-outline opacity-30"></div>
</div>
</main>
<!-- Exercise Detail Sheet (Fixed at bottom) -->
<section class="bg-surface-container rounded-t-[32px] px-margin-mobile pt-4 pb-8 w-full transform transition-transform duration-500 ease-out translate-y-0">
<!-- Drag Handle -->
<div class="w-12 h-1.5 bg-outline-variant/30 rounded-full mx-auto mb-6"></div>
<div class="flex justify-between items-center mb-6">
<div class="flex items-center gap-3">
<div class="w-2 h-2 rounded-full bg-error animate-pulse"></div>
<h2 class="font-headline-md text-headline-md text-primary">Pull-up <span class="text-outline font-normal">Weighted</span></h2>
</div>
<button class="p-2">
<span class="material-symbols-outlined text-outline">more_horiz</span>
</button>
</div>
<!-- Sets List -->
<div class="space-y-4 no-scrollbar max-h-[353px] overflow-y-auto pb-4">
<!-- Set 1 (Completed) -->
<div class="flex items-center justify-between py-2 group">
<div class="flex gap-8">
<span class="text-primary font-body-lg text-body-lg w-16">40 Kg</span>
<span class="text-primary font-body-lg text-body-lg">5 reps</span>
</div>
<button class="w-8 h-8 rounded-lg bg-primary flex items-center justify-center transition-all active:scale-90">
<span class="material-symbols-outlined text-background text-xl font-bold">check</span>
</button>
</div>
<!-- Set 2 (Completed) -->
<div class="flex items-center justify-between py-2 group">
<div class="flex gap-8">
<span class="text-primary font-body-lg text-body-lg w-16">40 Kg</span>
<span class="text-primary font-body-lg text-body-lg">5 reps</span>
</div>
<button class="w-8 h-8 rounded-lg bg-primary flex items-center justify-center transition-all active:scale-90">
<span class="material-symbols-outlined text-background text-xl font-bold">check</span>
</button>
</div>
<!-- Set 3 (Active/Upcoming) -->
<div class="flex items-center justify-between py-2 group">
<div class="flex gap-8">
<span class="text-primary font-body-lg text-body-lg w-16">40 Kg</span>
<span class="text-primary font-body-lg text-body-lg">5 reps</span>
</div>
<button class="w-8 h-8 rounded-lg border-2 border-outline/30 flex items-center justify-center transition-all active:scale-90 hover:border-primary">
<!-- Blank for incomplete -->
</button>
</div>
<!-- Set 4 (Upcoming) -->
<div class="flex items-center justify-between py-2 group opacity-40">
<div class="flex gap-8">
<span class="text-primary font-body-lg text-body-lg w-16">0 Kg</span>
<span class="text-primary font-body-lg text-body-lg">12 reps</span>
</div>
<button class="w-8 h-8 rounded-lg border-2 border-outline/30 flex items-center justify-center transition-all">
</button>
</div>
</div>
<!-- Bottom Controls inside the Sheet -->
<div class="flex gap-4 mt-6">
<button class="w-14 h-14 rounded-full bg-surface-container-high flex items-center justify-center active:scale-90 transition-transform">
<span class="material-symbols-outlined text-primary">add</span>
</button>
<button class="flex-1 h-14 rounded-full bg-surface-container-high flex items-center justify-center gap-2 active:scale-95 transition-all">
<span class="material-symbols-outlined text-primary text-xl">timer</span>
<span class="font-headline-md text-headline-md text-primary">03:00</span>
</button>
</div>
</section>
<!-- Invisible Overlay for interactions -->
<div class="fixed bottom-32 left-1/2 -translate-x-1/2 bg-surface-container-highest px-6 py-3 rounded-full text-primary font-label-sm text-label-sm opacity-0 pointer-events-none transition-opacity duration-300" id="toast">
        Set Completed
    </div>
<script>
        // Light micro-interactions
        const checkButtons = document.querySelectorAll('.rounded-lg');
        const toast = document.getElementById('toast');

        checkButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                const isCompleted = btn.classList.contains('bg-primary');
                
                if (!isCompleted) {
                    btn.classList.remove('border-2', 'border-outline/30');
                    btn.classList.add('bg-primary');
                    btn.innerHTML = '<span class="material-symbols-outlined text-background text-xl font-bold">check</span>';
                    
                    // Show simple toast
                    toast.style.opacity = '1';
                    setTimeout(() => {
                        toast.style.opacity = '0';
                    }, 2000);
                } else {
                    btn.classList.add('border-2', 'border-outline/30');
                    btn.classList.remove('bg-primary');
                    btn.innerHTML = '';
                }
            });
        });

        // Simple timer logic (Visual only)
        let seconds = 93;
        const timerDisplay = document.querySelector('.text-stat-lg');
        
        function updateTimer() {
            if (seconds > 0) {
                seconds--;
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                timerDisplay.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            }
        }

        setInterval(updateTimer, 1000);
    </script>
</body></html>
