<script>
        // Simple micro-interaction for workout cards
        document.querySelectorAll('section div[class*="active:scale"]').forEach(card => {
            card.addEventListener('click', () => {
                // Future expansion: navigation to specific workout detail
                console.log('Workout card tapped');
            });
        });

        // Navigation state handler
        const navButtons = document.querySelectorAll('nav button');
        navButtons.forEach(btn => {
            btn.addEventListener('click', function() {
                navButtons.forEach(b => {
                    b.classList.remove('text-primary');
                    b.classList.add('text-outline');
                    b.querySelector('span').style.fontVariationSettings = "'FILL' 0";
                });
                this.classList.remove('text-outline');
                this.classList.add('text-primary');
                this.querySelector('span').style.fontVariationSettings = "'FILL' 1";
            });
        });
    </script>
